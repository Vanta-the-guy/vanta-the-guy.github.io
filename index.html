
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Scramjet Required Global Imports -->
    <script src="/scramjet/scramjet.js"></script>
    <script src="/controller/controller.api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@3.0.1/dist/index.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            width: 100vw;
            height: 100vh;
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
        }

        /* Simple "Sans" Loading Screen */
        #setup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Comic Sans MS", "Comic Sans", sans-serif;
            color: #ffffff;
            transition: opacity 0.8s ease;
        }
        
        #loading-text {
            font-size: 24px;
            font-weight: normal;
            letter-spacing: 2px;
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        /* Sidebar & Slim Mode */
        .sidebar {
            width: 260px;
            background-color: #09090b;
            border-right: 1px solid #1f1f22;
            display: flex;
            flex-direction: column;
            padding: 12px;
            flex-shrink: 0;
            z-index: 10;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), padding 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-x: hidden;
        }

        .sidebar.collapsed { width: 60px; padding: 12px 6px; }

        .sidebar-header-controls { 
            display: flex; align-items: center; justify-content: space-between; 
            margin-bottom: 16px; padding: 0 4px; flex-wrap: wrap; gap: 8px;
        }

        .sidebar.collapsed .sidebar-header-controls { justify-content: center; }
        .sidebar.collapsed .nav-group { display: none; }
        .sidebar.collapsed .sidebar-search { display: none; }
        .sidebar.collapsed .app-grid { display: none; }
        .sidebar.collapsed .tab-title { display: none; }
        .sidebar.collapsed .tab-close { display: none; }
        .sidebar.collapsed .tab-item { padding: 10px; justify-content: center; }

        .nav-group { display: flex; gap: 4px; color: #a1a1aa; }
        
        .icon-btn { 
            background: transparent; border: none; color: inherit; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; border-radius: 6px; 
            padding: 6px; transition: all 0.2s ease; flex-shrink: 0;
        }
        .icon-btn:hover { color: #ffffff; background-color: #27272a; }
        .icon-btn.active { color: #ffffff; background-color: #3f3f46; }

        .sidebar-search {
            display: flex; align-items: center; background-color: #18181b; border: 1px solid #27272a;
            border-radius: 8px; padding: 6px 12px; margin-bottom: 16px; gap: 8px; transition: border-color 0.2s ease;
            flex-shrink: 0;
        }
        .sidebar-search:focus-within { border-color: #52525b; }
        .sidebar-search input { background: transparent; border: none; color: #e4e4e7; font-size: 13px; width: 100%; outline: none; }
        
        .sidebar-search .icon-btn { color: #a1a1aa; padding: 4px; margin-right: -6px; }
        .sidebar-search .icon-btn.starred { color: #fbbf24; }
        .sidebar-search .icon-btn.starred:hover { color: #f59e0b; }

        .app-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; flex-shrink: 0; }
        .app-tile {
            background-color: #18181b; border: 1px solid #27272a; border-radius: 8px; height: 48px;
            display: flex; align-items: center; justify-content: center; cursor: pointer; color: #e4e4e7;
            transition: all 0.2s ease; position: relative;
        }
        .app-tile:hover { background-color: #27272a; transform: translateY(-1px); }
        .app-tile img { width: 20px; height: 20px; border-radius: 4px; }

        .tab-list { display: flex; flex-direction: column; gap: 4px; flex-grow: 1; overflow-y: auto; overflow-x: hidden; }
        .tab-list::-webkit-scrollbar { width: 6px; }
        .tab-list::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        .tab-list::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

        .tab-item {
            display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px;
            cursor: pointer; font-size: 13px; color: #a1a1aa; border: 1px solid transparent; transition: all 0.2s ease;
        }
        .tab-item:hover { background-color: #18181b; color: #e4e4e7; }
        .tab-item.active { background-color: #27272a; color: #ffffff; border: 1px solid #3f3f46; }
        .tab-icon { display: flex; align-items: center; justify-content: center; color: inherit; width: 16px; flex-shrink: 0; }
        .tab-title { flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tab-close { opacity: 0; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 4px; color: #a1a1aa; transition: all 0.2s ease; flex-shrink: 0; }
        .tab-item:hover .tab-close, .tab-item.active .tab-close { opacity: 1; }
        .tab-close:hover { background-color: #ef4444; color: #ffffff; }

        /* Main Area */
        .main-area { flex-grow: 1; display: flex; flex-direction: column; background-color: #050505; transition: width 0.3s ease; }
        .content-area { flex-grow: 1; position: relative; background-color: #000000; }
        
        .loading-spinner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; align-items: center; justify-content: center; z-index: 5; pointer-events: none; color: #a1a1aa; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; display: none; background-color: #09090b; transition: filter 0.3s ease, opacity 0.3s ease; }
        iframe.active { display: block; }
        iframe.loading { filter: blur(12px); opacity: 0.4; }
    </style>
</head>
<body>

    <!-- Simple Setup Screen -->
    <div id="setup-overlay">
        <h1 id="loading-text">loading...</h1>
    </div>

    <!-- Main UI -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header-controls">
            <button class="icon-btn" id="sidebar-toggle" style="color: #a1a1aa;" title="Toggle Sidebar">
                <i data-lucide="menu" size="20"></i>
            </button>
            <div class="nav-group">
                <button class="icon-btn" onclick="navBack()"><i data-lucide="chevron-left" size="18"></i></button>
                <button class="icon-btn" onclick="navForward()"><i data-lucide="chevron-right" size="18"></i></button>
                <button class="icon-btn" onclick="reloadActiveTab()"><i data-lucide="rotate-cw" size="16"></i></button>
            </div>
        </div>

        <div class="sidebar-search">
            <i data-lucide="search" size="14" color="#a1a1aa"></i>
            <input type="text" id="url-input" value="/home" placeholder="Search or URL...">
            <button class="icon-btn" id="star-btn"><i data-lucide="star" size="16"></i></button>
        </div>

        <div class="app-grid" id="starred-grid">
            <div class="app-tile" onclick="addNewTab()"><i data-lucide="plus" size="18"></i></div>
        </div>

        <div class="tab-list" id="tab-list-container"></div>
    </div>

    <div class="main-area">
        <div class="content-area" id="iframe-container">
            <div class="loading-spinner" id="loading-spinner">
                <i data-lucide="loader-2" size="28"></i>
            </div>
        </div>
    </div>

    <script type="module">
        import { registerSW } from "/active/prxy/register-sw.mjs";

        lucide.createIcons();

        // Server List
        const WISP_URLS = [
            "wss://cdn.pcesc.org/adblock/",
            "wss://cdn.kcchallengevbc.com/adblock/",
            "wss://cdn.slcbmooc.org/adblock/"
        ];

        let swReady = null;
        let cachedWisp = null;
        let tabs = [];
        let activeTabId = null;
        let counter = 0;
        
        let scramjetController = null;
        let scramjetFrames = {};
        let currentScramjetWisp = null;
        
        let savedBookmarks = JSON.parse(localStorage.getItem('savedBookmarks')) || ["https://open.spotify.com", "https://instagram.com"];
        let starredUrls = new Set(savedBookmarks);

        const urlInput = document.getElementById('url-input');
        const starBtn = document.getElementById('star-btn');
        const starredGrid = document.getElementById('starred-grid');
        const loadingSpinner = document.getElementById('loading-spinner');

        document.getElementById('sidebar-toggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('collapsed');
        });

        // Silent Automatic Setup Process
        async function runInitialSetup() {
            try {
                if (typeof registerSW !== 'undefined') {
                    if (!swReady) swReady = registerSW();
                    await swReady;
                } else {
                    throw new Error("registerSW module missing.");
                }
                
                const pingPromises = WISP_URLS.map(url => {
                    return new Promise((resolve, reject) => {
                        let ws;
                        try { ws = new WebSocket(url); } catch (e) { return reject(e); }
                        
                        const timeoutId = setTimeout(() => {
                            if (ws.readyState !== WebSocket.OPEN) {
                                ws.close();
                                reject(new Error("Timeout"));
                            }
                        }, 3000);

                        ws.onopen = () => {
                            clearTimeout(timeoutId);
                            ws.close();
                            resolve(url);
                        };
                        
                        ws.onerror = (err) => {
                            clearTimeout(timeoutId);
                            reject(err);
                        };
                    });
                });

                cachedWisp = await Promise.any(pingPromises);
                await initScramjetCore(cachedWisp);

                setTimeout(() => {
                    const overlay = document.getElementById('setup-overlay');
                    if (overlay) {
                        overlay.style.opacity = '0';
                        setTimeout(() => overlay.remove(), 800);
                    }
                }, 500);

            } catch (err) {
                console.error(err);
                const loadingText = document.getElementById('loading-text');
                if (loadingText) {
                    loadingText.innerText = "connection failed.";
                    loadingText.style.color = "#ef4444";
                    loadingText.style.animation = "none";
                }
            }
        }

        window.navBack = function() {
            if (!activeTabId || !scramjetFrames[activeTabId]) return;
            try { scramjetFrames[activeTabId].back(); } catch(e){}
        };
        
        window.navForward = function() {
            if (!activeTabId || !scramjetFrames[activeTabId]) return;
            try { scramjetFrames[activeTabId].forward(); } catch(e){}
        };
        
        window.reloadActiveTab = function() {
            if (!activeTabId || !scramjetFrames[activeTabId]) return;
            try { scramjetFrames[activeTabId].reload(); } catch(e){}
        };

        function saveBookmarks() {
            localStorage.setItem('savedBookmarks', JSON.stringify(Array.from(starredUrls)));
        }

        function renderStarredGrid() {
            starredGrid.innerHTML = '';
            starredUrls.forEach(url => {
                let domain = url;
                try { domain = new URL(url).hostname; } catch(e) {}
                
                const tile = document.createElement('div');
                tile.className = 'app-tile';
                tile.title = domain;
                tile.onclick = () => loadShortcut(url, domain);
                tile.innerHTML = `<img src="https://www.google.com/s2/favicons?domain=${domain}&sz=64" alt="${domain}" onerror="this.outerHTML='<i data-lucide=\\'globe\\' size=\\'18\\'></i>'">`;
                starredGrid.appendChild(tile);
            });
            
            const plusBtn = document.createElement('div');
            plusBtn.className = 'app-tile';
            plusBtn.onclick = () => addNewTab();
            plusBtn.innerHTML = `<i data-lucide="plus" size="18"></i>`;
            starredGrid.appendChild(plusBtn);
            
            lucide.createIcons();
        }

        function updateStarUI(url) {
            if (starredUrls.has(url)) {
                starBtn.classList.add('starred');
                starBtn.innerHTML = `<i data-lucide="star" size="16" fill="currentColor"></i>`;
            } else {
                starBtn.classList.remove('starred');
                starBtn.innerHTML = `<i data-lucide="star" size="16"></i>`;
            }
            lucide.createIcons();
        }

        starBtn.addEventListener('click', () => {
            if (!activeTabId) return;
            const tab = tabs.find(t => t.id === activeTabId);
            if (starredUrls.has(tab.url)) {
                starredUrls.delete(tab.url);
            } else {
                starredUrls.add(tab.url);
            }
            saveBookmarks();
            updateStarUI(tab.url);
            renderStarredGrid();
        });
        
        async function initScramjetCore(wispUrl) {
            if (scramjetController && currentScramjetWisp === wispUrl) return; 
            if (typeof window.$scramjetController === 'undefined') {
                throw new Error("Scramjet controller script not loaded.");
            }
            const { Controller } = window.$scramjetController;
            const { defaultConfig } = window.$scramjet;
            const EpoxyTransport = self.EpoxyTransport?.default || window.EpoxyTransport;
            
            const registration = await navigator.serviceWorker.ready;
            const serviceworker = navigator.serviceWorker.controller || registration.active;
            if (!serviceworker) throw new Error("No active service worker found.");
            
            const transport = new EpoxyTransport({ wisp: wispUrl });
            await transport.init();
            
            scramjetController = new Controller({ serviceworker, transport, scramjetConfig: defaultConfig });
            await scramjetController.wait();
            currentScramjetWisp = wispUrl;
            scramjetFrames = {};
        }

        function searchUrl(input) {
            if (input === '/home') return input;
            try { return new URL(input).toString(); } catch (e) {}
            try {
                const u = new URL(`http://${input}`);
                if (u.hostname.includes(".")) return u.toString();
            } catch (e) {}
            return "https://www.google.com/search?q=" + encodeURIComponent(input);
        }

        function updateTabIcon(tabId, rawUrl) {
            const iconEl = document.querySelector(`#tab-btn-${tabId} .tab-icon`);
            if (!iconEl) return;
            if (rawUrl === '/home') {
                iconEl.innerHTML = `<i data-lucide="home" size="16"></i>`;
                lucide.createIcons();
                return;
            }
            try {
                let domain = searchUrl(rawUrl);
                if (domain.startsWith('http')) {
                    domain = new URL(domain).hostname;
                }
                iconEl.innerHTML = `<img src="https://www.google.com/s2/favicons?domain=${domain}&sz=32" style="width:16px;height:16px;border-radius:2px;" onerror="this.outerHTML='<i data-lucide=\\'globe\\' size=\\'16\\'></i>'">`;
            } catch (e) {
                iconEl.innerHTML = `<i data-lucide="globe" size="16"></i>`;
                lucide.createIcons();
            }
        }

        async function loadUrlInTab(tabId, rawUrl) {
            const iframe = document.getElementById(`frame-${tabId}`);
            if (!iframe) return;

            iframe.classList.add('loading');
            if (tabId === activeTabId) loadingSpinner.style.display = 'flex';

            iframe.onload = () => {
                iframe.classList.remove('loading');
                if (tabId === activeTabId) loadingSpinner.style.display = 'none';

                try {
                    const loc = iframe.contentWindow.location;
                    if (loc.pathname.endsWith('home.html') || loc.href === 'about:blank') {
                        return;
                    }

                    const path = loc.pathname + loc.search + loc.hash;
                    let realUrl = "";

                    if (typeof __scramjet$config !== 'undefined' && path.startsWith(__scramjet$config.prefix)) {
                        realUrl = __scramjet$config.decodeUrl(path.substring(__scramjet$config.prefix.length));
                    }

                    if (realUrl && realUrl !== "about:blank") {
                        let realTitle = iframe.contentDocument ? iframe.contentDocument.title : "";
                        if (!realTitle) realTitle = new URL(realUrl).hostname || realUrl;

                        const tab = tabs.find(t => t.id === tabId);
                        if (tab) {
                            tab.url = realUrl;
                            tab.title = realTitle;
                        }

                        const titleEl = document.getElementById(`title-${tabId}`);
                        if (titleEl) titleEl.innerText = realTitle;
                        updateTabIcon(tabId, realUrl);

                        if (tabId === activeTabId) {
                            urlInput.value = realUrl;
                            updateStarUI(realUrl);
                        }
                    }
                } catch(e) {}
            };

            updateTabIcon(tabId, rawUrl);
            const targetUrl = searchUrl(rawUrl);
            
            if (rawUrl !== '/home') {
                try {
                    if (!scramjetController) {
                        await initScramjetCore(cachedWisp);
                    }
                    if (!scramjetFrames[tabId] && scramjetController) {
                        scramjetFrames[tabId] = scramjetController.createFrame(iframe);
                    }
                    if (scramjetFrames[tabId]) {
                        scramjetFrames[tabId].go(targetUrl);
                    }
                } catch (e) {
                    loadingSpinner.style.display = 'none';
                    iframe.classList.remove('loading');
                    console.error("Frame routing failed", e);
                }
            } else {
                iframe.removeAttribute('srcdoc'); 
                iframe.src = 'home.html';
                
                const titleEl = document.getElementById(`title-${tabId}`);
                if (titleEl) titleEl.innerText = "Home";
                
                iframe.classList.remove('loading');
                if (tabId === activeTabId) loadingSpinner.style.display = 'none';
            }
        }

        window.addNewTab = async function(initialUrl = "/home", title = "Home") {
            const id = `tab-${counter++}`;
            tabs.push({ id, url: initialUrl, title });

            const tabList = document.getElementById('tab-list-container');
            const tabEl = document.createElement('div');
            tabEl.className = 'tab-item';
            tabEl.id = `tab-btn-${id}`;
            tabEl.onclick = () => switchTab(id);
            tabEl.innerHTML = `
                <div class="tab-icon"><i data-lucide="globe" size="16"></i></div>
                <div class="tab-title" id="title-${id}">${title}</div>
                <div class="tab-close" onclick="closeTab('${id}', event)"><i data-lucide="x" size="14"></i></div>
            `;
            tabList.appendChild(tabEl);

            const container = document.getElementById('iframe-container');
            const iframe = document.createElement('iframe');
            iframe.id = `frame-${id}`;
            iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox');
            container.appendChild(iframe);

            lucide.createIcons();
            switchTab(id);
            await loadUrlInTab(id, initialUrl);
        };

        window.switchTab = function(id) {
            activeTabId = id;
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('iframe').forEach(i => i.classList.remove('active'));

            const activeBtn = document.getElementById(`tab-btn-${id}`);
            const activeFrame = document.getElementById(`frame-${id}`);

            if (activeBtn) activeBtn.classList.add('active');
            if (activeFrame) {
                activeFrame.classList.add('active');
                if (activeFrame.classList.contains('loading')) {
                    loadingSpinner.style.display = 'flex';
                } else {
                    loadingSpinner.style.display = 'none';
                }
            }

            const tab = tabs.find(t => t.id === id);
            if (tab) {
                urlInput.value = tab.url;
                updateStarUI(tab.url);
            }
        };

        window.closeTab = function(id, event) {
            event.stopPropagation();
            const tabBtn = document.getElementById(`tab-btn-${id}`);
            const frame = document.getElementById(`frame-${id}`);
            if (tabBtn) tabBtn.remove();
            if (frame) frame.remove();
            if (scramjetFrames[id]) delete scramjetFrames[id];

            tabs = tabs.filter(t => t.id !== id);
            if (tabs.length === 0) addNewTab("/home", "Home");
            else if (activeTabId === id) switchTab(tabs[tabs.length - 1].id);
        };

        window.loadShortcut = async function(url, title) {
            if (!activeTabId) {
                await addNewTab(url, title);
                return;
            }
            const tab = tabs.find(t => t.id === activeTabId);
            tab.url = url;
            tab.title = title;
            document.getElementById(`title-${activeTabId}`).innerText = title;
            urlInput.value = url;
            updateStarUI(url);
            await loadUrlInTab(activeTabId, url);
        };

        urlInput.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter' && activeTabId) {
                const val = urlInput.value.trim();
                if (!val) return;
                const tab = tabs.find(t => t.id === activeTabId);
                tab.url = val;
                tab.title = val;
                document.getElementById(`title-${activeTabId}`).innerText = val;
                updateStarUI(val);
                await loadUrlInTab(activeTabId, val);
            }
        });

        renderStarredGrid();
        addNewTab("/home", "Home");
        
        // Start silent setup sequence on load
        runInitialSetup();
    </script>
</body>
</html>
