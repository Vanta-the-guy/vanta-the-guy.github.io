<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/scramjet/scramjet.js"></script>
    <script src="/controller/controller.api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@3.0.1/dist/index.js"></script>

<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
        width: 100vw; height: 100vh;
        background-color: #050505; color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden; display: flex;
    }

    /* Boot Screen */
    #boot-screen {
        position: fixed; inset: 0; background-color: #000000; color: #ffffff;
        z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
        transition: opacity 0.5s ease, visibility 0.5s;
    }
    #boot-log { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 8px; }
    .boot-line { font-size: 14px; font-weight: 500; color: #a1a1aa; display: flex; align-items: center; gap: 8px; }
    .boot-line.active { color: #ffffff; }
    .boot-line.success { color: #10b981; }
    .boot-line.error { color: #ef4444; }
    .boot-spinner { animation: spin 1s linear infinite; width: 14px; height: 14px; border: 2px solid transparent; border-top-color: currentColor; border-radius: 50%; }

    /* Sidebar */
    .sidebar {
        width: 260px; background-color: #09090b; border-right: 1px solid #1f1f22;
        display: flex; flex-direction: column; padding: 12px; flex-shrink: 0;
        z-index: 10; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), padding 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        overflow-x: hidden;
    }
    .sidebar.collapsed { width: 60px; padding: 12px 6px; }
    .sidebar-header-controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding: 0 4px; flex-wrap: wrap; gap: 8px; }
    .sidebar.collapsed .sidebar-header-controls { justify-content: center; }
    .sidebar.collapsed .nav-group, .sidebar.collapsed .sidebar-search, .sidebar.collapsed .app-grid, .sidebar.collapsed .tab-title, .sidebar.collapsed .tab-close { display: none; }
    .sidebar.collapsed .tab-item { padding: 10px; justify-content: center; }

    .nav-group { display: flex; gap: 4px; color: #a1a1aa; }
    .icon-btn { background: transparent; border: none; color: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 6px; padding: 6px; transition: all 0.2s ease; flex-shrink: 0; }
    .icon-btn:hover { color: #ffffff; background-color: #27272a; }
    .icon-btn.active { color: #ffffff; background-color: #3f3f46; }

    .sidebar-search { display: flex; align-items: center; background-color: #18181b; border: 1px solid #27272a; border-radius: 8px; padding: 6px 12px; margin-bottom: 16px; gap: 8px; transition: border-color 0.2s ease; flex-shrink: 0; }
    .sidebar-search:focus-within { border-color: #52525b; }
    .sidebar-search input { background: transparent; border: none; color: #e4e4e7; font-size: 13px; width: 100%; outline: none; }
    .sidebar-search .icon-btn { color: #a1a1aa; padding: 4px; margin-right: -6px; }
    .sidebar-search .icon-btn.starred { color: #fbbf24; }
    .sidebar-search .icon-btn.starred:hover { color: #f59e0b; }

    .app-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; flex-shrink: 0; }
    .app-tile { background-color: #18181b; border: 1px solid #27272a; border-radius: 8px; height: 48px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #e4e4e7; transition: all 0.2s ease; }
    .app-tile:hover { background-color: #27272a; transform: translateY(-1px); }
    .app-tile img { width: 20px; height: 20px; border-radius: 4px; }

    .tab-list { display: flex; flex-direction: column; gap: 4px; flex-grow: 1; overflow-y: auto; overflow-x: hidden; }
    .tab-list::-webkit-scrollbar { width: 6px; }
    .tab-list::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
    .tab-list::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    .tab-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: #a1a1aa; border: 1px solid transparent; transition: all 0.2s ease; }
    .tab-item:hover { background-color: #18181b; color: #e4e4e7; }
    .tab-item.active { background-color: #27272a; color: #ffffff; border: 1px solid #3f3f46; }
    .tab-icon { display: flex; align-items: center; justify-content: center; color: inherit; width: 16px; flex-shrink: 0; }
    .tab-title { flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tab-close { opacity: 0; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 4px; color: #a1a1aa; transition: all 0.2s ease; flex-shrink: 0; }
    .tab-item:hover .tab-close, .tab-item.active .tab-close { opacity: 1; }
    .tab-close:hover { background-color: #ef4444; color: #ffffff; }

    /* Main Area & iFrames */
    .main-area { flex-grow: 1; display: flex; flex-direction: column; background-color: #050505; transition: width 0.3s ease; position: relative; }
    .content-area { flex-grow: 1; position: relative; background-color: #000000; overflow: hidden; }
    
    .home-view { position: absolute; inset: 0; width: 100%; height: 100%; border: none; z-index: 2; opacity: 0; display: none; transition: opacity 0.3s ease; background-color: #131316; }
    .home-view.active { display: block; opacity: 1; }

    iframe.proxy-frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; display: none; background-color: #09090b; transition: filter 0.3s ease, opacity 0.3s ease; z-index: 1; }
    iframe.proxy-frame.active { display: block; }
    iframe.proxy-frame.loading { filter: blur(12px); opacity: 0.4; pointer-events: none; }

    .loading-spinner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; align-items: center; justify-content: center; z-index: 5; pointer-events: none; opacity: 0; transition: opacity 0.3s ease; }
    .loading-spinner.active { display: flex; opacity: 1; }
    .spinner-glass { background: rgba(24, 24, 27, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(63, 63, 70, 0.5); padding: 16px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); color: #a1a1aa; display: flex; align-items: center; justify-content: center; animation: spin 0.8s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="boot-screen">
    <div id="boot-log"></div>
</div>

<div class="sidebar" id="sidebar">
    <div class="sidebar-header-controls">
        <button class="icon-btn" id="sidebar-toggle" style="color: #a1a1aa;" title="Toggle Sidebar"><i data-lucide="menu" size="20"></i></button>
        <div class="nav-group">
            <button class="icon-btn" onclick="navBack()"><i data-lucide="chevron-left" size="18"></i></button>
            <button class="icon-btn" onclick="navForward()"><i data-lucide="chevron-right" size="18"></i></button>
            <button class="icon-btn" onclick="reloadActiveTab()"><i data-lucide="rotate-cw" size="16"></i></button>
        </div>
    </div>
    <div class="sidebar-search">
        <i data-lucide="search" size="14" color="#a1a1aa"></i>
        <input type="text" id="url-input" value="/home" placeholder="Search or URL..." autocomplete="off">
        <button class="icon-btn" id="star-btn"><i data-lucide="star" size="16"></i></button>
    </div>
    <div class="app-grid" id="starred-grid"></div>
    <div class="tab-list" id="tab-list-container"></div>
</div>

<div class="main-area">
    <div class="content-area" id="iframe-container">
        <!-- Dedicated Home iframe -->
        <iframe id="home-view" class="home-view" src="home.html"></iframe>

        <div class="loading-spinner" id="loading-spinner">
            <div class="spinner-glass"><i data-lucide="loader-2" size="28"></i></div>
        </div>
    </div>
</div>

<script type="module">
    lucide.createIcons();

    const WISP_URLS = [
        "wss://cdn.pcesc.org/adblock/",
        "wss://cdn.kcchallengevbc.com/adblock/",
        "wss://cdn.slcbmooc.org/adblock/",
        "wss://reverse.myapl.org/",
        "wss://onyxv1.ai.studio/"
    ];

    let cachedWisp = null;
    let tabs = [];
    let activeTabId = null;
    let counter = 0;
    
    let scramjetController = null;
    let scramjetFrames = {};
    
    let savedBookmarks = JSON.parse(localStorage.getItem('savedBookmarks')) || ["https://open.spotify.com", "https://instagram.com"];
    let starredUrls = new Set(savedBookmarks);
    
    const urlInput = document.getElementById('url-input');
    const starBtn = document.getElementById('star-btn');
    const starredGrid = document.getElementById('starred-grid');
    const loadingSpinner = document.getElementById('loading-spinner');
    const homeView = document.getElementById('home-view');

    document.getElementById('sidebar-toggle').addEventListener('click', () => { document.getElementById('sidebar').classList.toggle('collapsed'); });

    window.navBack = function() { if (activeTabId && scramjetFrames[activeTabId]) try { scramjetFrames[activeTabId].back(); } catch(e){} };
    window.navForward = function() { if (activeTabId && scramjetFrames[activeTabId]) try { scramjetFrames[activeTabId].forward(); } catch(e){} };
    window.reloadActiveTab = function() { if (activeTabId && scramjetFrames[activeTabId]) try { scramjetFrames[activeTabId].reload(); } catch(e){} };

    function saveBookmarks() { localStorage.setItem('savedBookmarks', JSON.stringify(Array.from(starredUrls))); }

    /* Boot Sequence Logic */
    function createLogEntry(msg) {
        const el = document.createElement('div'); el.className = 'boot-line active';
        el.innerHTML = `<div class="boot-spinner"></div> <span>${msg}</span>`;
        document.getElementById('boot-log').appendChild(el); return el;
    }
    function updateLogEntry(el, msg, status) {
        el.className = `boot-line ${status}`;
        let icon = status === 'success' ? 'check-circle' : 'x-circle';
        el.innerHTML = `<i data-lucide="${icon}" size="14"></i> <span>${msg}</span>`;
        lucide.createIcons();
    }

    async function runBootSequence() {
        const swLog = createLogEntry('Registering sw.js...');
        try {
            if ('serviceWorker' in navigator) {
                await navigator.serviceWorker.register('/sw.js');
                await navigator.serviceWorker.ready;
                updateLogEntry(swLog, 'Registered sw.js successfully', 'success');
            } else { updateLogEntry(swLog, 'Service Workers not supported', 'error'); }
        } catch (err) { updateLogEntry(swLog, `Service Worker Error: ${err.message}`, 'error'); }

        let validServer = null;
        for (const url of WISP_URLS) {
            const pingLog = createLogEntry(`Checking server: ${url}`);
            try {
                const ws = new WebSocket(url);
                await new Promise((resolve, reject) => {
                    ws.onopen = () => { ws.close(); resolve(); };
                    ws.onerror = reject;
                    setTimeout(reject, 2500); 
                });
                updateLogEntry(pingLog, `${url} is active`, 'success');
                validServer = url; break; 
            } catch (err) { updateLogEntry(pingLog, `${url} blocked or down`, 'error'); }
        }

        if (!validServer) {
            const failLog = createLogEntry('Fallback to auto-configuration...');
            updateLogEntry(failLog, 'No unblocked servers found. Trying default.', 'error');
            validServer = WISP_URLS[0]; 
        }

        await initScramjetCore(validServer);
        
        setTimeout(() => {
            document.getElementById('boot-screen').style.opacity = '0';
            document.getElementById('boot-screen').style.visibility = 'hidden';
            setTimeout(() => document.getElementById('boot-screen').remove(), 500);
            addNewTab("/home", "Home");
            renderStarredGrid();
        }, 800);
    }

    async function initScramjetCore(wispUrl) {
        cachedWisp = wispUrl;
        if (typeof window.$scramjetController === 'undefined') return;
        const { Controller } = window.$scramjetController;
        const { defaultConfig } = window.$scramjet;
        const EpoxyTransport = self.EpoxyTransport.default;
        
        const serviceworker = navigator.serviceWorker.controller ?? (await navigator.serviceWorker.ready).active;
        const transport = new EpoxyTransport({ wisp: wispUrl });
        await transport.init();
        
        scramjetController = new Controller({ serviceworker, transport, scramjetConfig: defaultConfig });
        await scramjetController.wait();
    }

    /* Grid & Bookmarks */
    function renderStarredGrid() {
        starredGrid.innerHTML = '';
        starredUrls.forEach(url => {
            let domain = url;
            try { domain = new URL(url).hostname; } catch(e) {}
            const tile = document.createElement('div');
            tile.className = 'app-tile'; tile.title = domain; tile.onclick = () => loadShortcut(url, domain);
            tile.innerHTML = `<img src="https://www.google.com/s2/favicons?domain=${domain}&sz=64" alt="${domain}" onerror="this.outerHTML='<i data-lucide=\\'globe\\' size=\\'18\\'></i>'">`;
            starredGrid.appendChild(tile);
        });
        const plusBtn = document.createElement('div');
        plusBtn.className = 'app-tile'; plusBtn.onclick = () => addNewTab(); plusBtn.innerHTML = `<i data-lucide="plus" size="18"></i>`;
        starredGrid.appendChild(plusBtn);
        lucide.createIcons();
    }

    function updateStarUI(url) {
        if (starredUrls.has(url)) { starBtn.classList.add('starred'); starBtn.innerHTML = `<i data-lucide="star" size="16" fill="currentColor"></i>`; } 
        else { starBtn.classList.remove('starred'); starBtn.innerHTML = `<i data-lucide="star" size="16"></i>`; }
        lucide.createIcons();
    }

    starBtn.addEventListener('click', () => {
        if (!activeTabId) return;
        const tab = tabs.find(t => t.id === activeTabId);
        if (starredUrls.has(tab.url)) starredUrls.delete(tab.url); else starredUrls.add(tab.url);
        saveBookmarks(); updateStarUI(tab.url); renderStarredGrid();
    });

    /* Tab & Navigation Logic */
    function searchUrl(input) {
        if (input === '/home') return input;
        try { return new URL(input).toString(); } catch (e) {}
        try { const u = new URL(`http://${input}`); if (u.hostname.includes(".")) return u.toString(); } catch (e) {}
        return "https://www.google.com/search?q=" + encodeURIComponent(input);
    }

    function updateTabIcon(tabId, rawUrl) {
        const iconEl = document.querySelector(`#tab-btn-${tabId} .tab-icon`);
        if (!iconEl) return;
        if (rawUrl === '/home') { iconEl.innerHTML = `<i data-lucide="home" size="16"></i>`; lucide.createIcons(); return; }
        try {
            let domain = searchUrl(rawUrl);
            if (domain.startsWith('http')) domain = new URL(domain).hostname;
            iconEl.innerHTML = `<img src="https://www.google.com/s2/favicons?domain=${domain}&sz=32" style="width:16px;height:16px;border-radius:2px;" onerror="this.outerHTML='<i data-lucide=\\'globe\\' size=\\'16\\'></i>'">`;
        } catch (e) { iconEl.innerHTML = `<i data-lucide="globe" size="16"></i>`; lucide.createIcons(); }
    }

    async function loadUrlInTab(tabId, rawUrl) {
        const tab = tabs.find(t => t.id === tabId);
        if (!tab) return;
        
        tab.url = rawUrl;
        updateTabIcon(tabId, rawUrl);
        
        if (rawUrl === '/home') {
            tab.title = "Home";
            document.getElementById(`title-${tabId}`).innerText = "Home";
            if (tabId === activeTabId) switchTab(tabId);
            return;
        }
        
        const targetUrl = searchUrl(rawUrl);
        const iframe = document.getElementById(`frame-${tabId}`);
        if (!iframe) return;

        iframe.classList.add('loading');
        if (tabId === activeTabId) {
            loadingSpinner.classList.add('active');
            switchTab(tabId); 
        }

        iframe.onload = () => {
            iframe.classList.remove('loading');
            if (tabId === activeTabId) loadingSpinner.classList.remove('active');
            try {
                const loc = iframe.contentWindow.location;
                const path = loc.pathname + loc.search + loc.hash;
                let realUrl = "";
                if (typeof window.$scramjet !== 'undefined' && typeof __scramjet$config !== 'undefined' && path.startsWith(__scramjet$config.prefix)) {
                    realUrl = __scramjet$config.decodeUrl(path.substring(__scramjet$config.prefix.length));
                }
                if (realUrl && realUrl !== "about:blank") {
                    let realTitle = iframe.contentDocument ? iframe.contentDocument.title : "";
                    if (!realTitle) realTitle = new URL(realUrl).hostname || realUrl;
                    tab.url = realUrl; tab.title = realTitle;
                    document.getElementById(`title-${tabId}`).innerText = realTitle;
                    updateTabIcon(tabId, realUrl);
                    if (tabId === activeTabId) { urlInput.value = realUrl; updateStarUI(realUrl); }
                }
            } catch(e) {}
        };

        if (!scramjetFrames[tabId] && scramjetController) scramjetFrames[tabId] = scramjetController.createFrame(iframe);
        if (scramjetFrames[tabId]) scramjetFrames[tabId].go(targetUrl);
    }

    window.addNewTab = async function(initialUrl = "/home", title = "Home") {
        const id = `tab-${counter++}`;
        tabs.push({ id, url: initialUrl, title });

        const tabList = document.getElementById('tab-list-container');
        const tabEl = document.createElement('div');
        tabEl.className = 'tab-item'; tabEl.id = `tab-btn-${id}`;
        tabEl.onclick = () => switchTab(id);
        tabEl.innerHTML = `<div class="tab-icon"><i data-lucide="globe" size="16"></i></div><div class="tab-title" id="title-${id}">${title}</div><div class="tab-close" onclick="closeTab('${id}', event)"><i data-lucide="x" size="14"></i></div>`;
        tabList.appendChild(tabEl);

        const container = document.getElementById('iframe-container');
        const iframe = document.createElement('iframe');
        iframe.id = `frame-${id}`; iframe.className = 'proxy-frame';
        iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox');
        container.appendChild(iframe);

        lucide.createIcons();
        switchTab(id);
        await loadUrlInTab(id, initialUrl);
    };

    window.switchTab = function(id) {
        activeTabId = id;
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('iframe.proxy-frame').forEach(i => i.classList.remove('active'));

        const activeBtn = document.getElementById(`tab-btn-${id}`);
        const activeFrame = document.getElementById(`frame-${id}`);
        const tab = tabs.find(t => t.id === id);

        if (activeBtn) activeBtn.classList.add('active');

        if (tab && tab.url === '/home') {
            homeView.classList.add('active');
            if (activeFrame) activeFrame.classList.remove('active');
            loadingSpinner.classList.remove('active');
        } else {
            homeView.classList.remove('active');
            if (activeFrame) {
                activeFrame.classList.add('active');
                if (activeFrame.classList.contains('loading')) loadingSpinner.classList.add('active');
                else loadingSpinner.classList.remove('active');
            }
        }
        if (tab) { urlInput.value = tab.url; updateStarUI(tab.url); }
    };

    window.closeTab = function(id, event) {
        event.stopPropagation();
        const tabBtn = document.getElementById(`tab-btn-${id}`);
        const frame = document.getElementById(`frame-${id}`);
        if (tabBtn) tabBtn.remove();
        if (frame) frame.remove();
        if (scramjetFrames[id]) delete scramjetFrames[id];

        tabs = tabs.filter(t => t.id !== id);
        if (tabs.length === 0) addNewTab("/home", "Home");
        else if (activeTabId === id) switchTab(tabs[tabs.length - 1].id);
    };

    window.loadShortcut = async function(url, title) {
        if (!activeTabId) { await addNewTab(url, title); return; }
        const tab = tabs.find(t => t.id === activeTabId);
        tab.url = url; tab.title = title;
        document.getElementById(`title-${activeTabId}`).innerText = title;
        urlInput.value = url; updateStarUI(url);
        await loadUrlInTab(activeTabId, url);
    };

    urlInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const val = urlInput.value.trim();
            if (!val || !activeTabId) return;
            const tab = tabs.find(t => t.id === activeTabId);
            tab.url = val; tab.title = val;
            document.getElementById(`title-${activeTabId}`).innerText = val;
            urlInput.value = val; updateStarUI(val);
            loadUrlInTab(activeTabId, val);
        }
    });

    runBootSequence();
</script>

</body>
</html>
